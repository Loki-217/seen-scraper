<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SeenFetch Studio - See it, Fetch it</title>
    <meta name="description" content="SeenFetch: Visual web data extraction tool. No coding required.">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/studio.css">
</head>
<body>

<!-- Top Bar -->
<header class="topbar">
    <a href="index.html" class="brand logo" style="text-decoration:none; color:inherit;">
        <svg class="logo-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="4"/></svg>
        <span class="brand-name">SeenFetch</span>
        <span class="brand-badge">Studio</span>
    </a>

    <div class="url-input-wrapper">
        <span class="url-prefix"><svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></span>
        <input type="url" class="url-input" id="urlInput"
               placeholder="Enter URL to start extracting data..."
               value="https://quotes.toscrape.com/">
    </div>

    <button class="btn btn-topbar" id="loadBtn" onclick="startSession()">Load</button>
    <button class="btn btn-topbar btn-topbar-danger hidden" id="closeBtn" onclick="closeSession()">End</button>

    <div class="session-status" id="sessionStatus">
        <span class="status-dot"></span>
        <span class="status-text">Ready</span>
    </div>
    <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">
        <span id="topbarUsername" style="color:rgba(255,255,255,0.8);font-size:13px;font-weight:500;"></span>
        <button onclick="logout()" style="background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.25);border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer;color:white;">Logout</button>
    </div>
</header>

<!-- Workspace -->
<main class="workspace">
    <div class="workspace-main">
        <!-- Browser Pane -->
        <section class="browser-pane">
            <!-- Browser Toolbar -->
            <div class="browser-toolbar">
                <span class="toolbar-url" id="currentUrl">No page loaded</span>
                <div class="toolbar-actions">
                    <button class="btn btn-sm btn-secondary" onclick="canvas && canvas.requestElements()" title="Refresh elements"><svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><polyline points="23 20 23 14 17 14"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4-4.64 4.36A9 9 0 0 1 3.51 15"/></svg></button>
                </div>
            </div>

            <!-- Browser Canvas Container -->
            <div class="browser-container" id="browserContainer">
                <!-- Empty state -->
                <div class="empty-state" id="emptyState">
                    <div class="empty-icon"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color:var(--primary)"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="4"/></svg></div>
                    <p>Enter a URL and click <strong>Load</strong> to start</p>
                    <p class="text-muted">Real-time page preview with element detection</p>
                </div>
            </div>

            <!-- Browser Status Bar -->
            <div class="browser-statusbar">
                <span>Elements: <strong id="elementCount">0</strong></span>
                <span>Selected: <strong id="selectionCount">0</strong></span>
                <span>FPS: <strong id="frameRate">0</strong></span>
            </div>

            <!-- Bottom Preview Dock -->
            <div class="preview-dock collapsed" id="previewDock">
                <div class="dock-header" onclick="togglePreviewDock()">
                    <div class="dock-title">
                        <span><svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg></span>
                        <span>Output Data Preview</span>
                        <span id="previewItemCount" class="dock-count"></span>
                    </div>
                    <button class="dock-toggle" id="dockToggleBtn">↑</button>
                </div>
                <div class="dock-body" id="dockBody">
                    <div id="dockPreviewTable" class="dock-table-container">
                        <div class="dock-empty">
                            It looks like you have not selected anything for extraction yet.
                            Once you do, you will see a preview of your selections here.
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Guide Pane (right side) -->
        <aside class="config-pane">
            <!-- Guide icon -->
            <div class="guide-icon-area">
                <div class="guide-icon-circle"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color:var(--primary)"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="4"/></svg></div>
            </div>

            <!-- Guide content (state machine renders here) -->
            <div class="guide-content" id="guideContent">
                <!-- Rendered by JS -->
            </div>

            <!-- Recorded steps (appended below guide content) -->
            <div id="recordedSteps"></div>

            <!-- Fixed footer -->
            <div class="guide-footer">
                <button class="btn-discard" onclick="discardRobot()">Discard</button>
                <button class="btn-capture-more" id="captureMoreBtn" onclick="setGuideState('captureType')" style="display:none;">+ Capture More</button>
                <button class="btn-finish" id="finishBtn" onclick="saveAsRobot()" disabled>Finish</button>
            </div>
        </aside>
    </div>
</main>

<!-- Toast Container -->
<div id="toastContainer"></div>

<!-- Scripts -->
<script src="js/icons.js"></script>
<script src="js/auth.js"></script>
<script src="js/browser-canvas.js"></script>
<script src="js/studio.js"></script>

</body>
</html>
